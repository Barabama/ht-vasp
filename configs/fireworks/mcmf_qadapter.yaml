# mcmf_qadapter.yaml - QueueAdapter Configuration for Slurm
# Copy this file to ~/.fireworks/mcmf_qadapter.yaml

# Adapter type
_fw_name: CommonAdapter

# Rocket launch command
rocket_launch: rlaunch -c /home/mcmf429/nfs_hdd/2025/gaominliang/ht-vasp/configs/fireworks rapidfire

# Slurm commands
submit_cmd: sbatch
status_cmd: squeue -j $JOB_ID

# Job tracking file (absolute path recommended)
jobs_file: /home/mcmf429/nfs_hdd/2025/gaominliang/ht-vasp/configs/fireworks/jobs.json

# Cleanup options
remove_submit_file: true
remove_launch_file: true

# Log directory
logdir: /home/mcmf429/nfs_hdd/2025/gaominliang/ht-vasp/logs/fireworks/qlaunch

# Default Slurm resource parameters
nodes: 1
ntasks: 48
cpus_per_task: 1
partition: partCPU
time_limit: '100:00:00'
memory: 20G

# Pre-rocket execution commands
pre_rocket: |
  . /opt/miniconda3/etc/profile.d/conda.sh
  conda activate htvasp
  module purge
  ulimit -s unlimited

# Slurm job script template
template: |
  #!/bin/bash

  #SBATCH -J {{name}}
  #SBATCH -o {{logdir}}/{{name}}.out
  #SBATCH -e {{logdir}}/{{name}}.err
  #SBATCH -N {{nodes}}
  #SBATCH -n {{ntasks}}
  #SBATCH -c {{cpus_per_task}}
  #SBATCH -p {{partition}}
  #SBATCH -t {{time_limit}}
  #SBATCH --mem={{memory}}

  {% if pre_rocket %}
  {{pre_rocket}}
  {% endif %}

  # Change to launch directory
  cd {{launch_dir}}

  # Execute the rocket
  {{rocket_launch}}
